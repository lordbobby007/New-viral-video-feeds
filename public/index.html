    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    /* Real vertical slide track, similar to Reels/TikTok */
    #track {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translate3d(0, 0, 0);
      transition: transform 420ms cubic-bezier(.22,.61,.36,1);
      will-change: transform;
    }

    .page {
      position: absolute;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
      font-size: 15px;
    }

    #loading.hidden { display: none; }

    #brand {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 14px);
      left: 16px;
      z-index: 20;
      padding: 10px 16px;
      border: 0;
      border-radius: 22px;
      color: #fff;
      background: rgba(0,0,0,.55);
      font-size: 16px;
      font-weight: 700;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      pointer-events: none;
    }

    #mute {
      position: absolute;
      right: 18px;
      bottom: calc(env(safe-area-inset-bottom) + 28px);
      z-index: 25;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0,0,0,.58);
      font-size: 21px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }

    /* Gate */
    #gate {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.15),
        rgba(0,0,0,.35) 45%,
        rgba(0,0,0,.76)
      );
    }

    #gate.show { display: flex; }

    #gate-title {
      margin-bottom: 8px;
      font-size: 23px;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }

    #gate-text {
      margin-bottom: 18px;
      font-size: 14px;
      opacity: .92;
    }

    #watchMore {
      min-width: 190px;
      padding: 14px 26px;
      border: 0;
      border-radius: 28px;
      color: #111;
      background: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 7px 25px rgba(0,0,0,.4);
    }

    #watchMore:active {
      transform: scale(.96);
    }

    #swipe {
      position: absolute;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 34px);
      z-index: 12;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 20px;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.45);
      font-size: 13px;
      pointer-events: none;
      transition: opacity .5s;
    }

    #swipe.hidden { opacity: 0; }

    #error {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 40;
      display: none;
      width: 90%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
    }

    #error button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
    }

    const app = document.getElementById("app");
    const track = document.getElementById("track");
    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const mute = document.getElementById("mute");
    const gate = document.getElementById("gate");
    const watchMore = document.getElementById("watchMore");
    const retry = document.getElementById("retry");
    const swipe = document.getElementById("swipe");
    const errorBox = document.getElementById("error");

    let currentIndex = 0;
    let startY = 0;
    let startX = 0;
    let dragging = false;
    let changing = false;
    let loadToken = 0;
    let unlocked = true;
    let normalFeed = true;

    function isGateIndex(index) {
      return (index + 1) % 5 === 0;
    }

    function updateTrack(animate = true) {
      // There is only ONE video element for fast loading.
      // Do not move the track itself, otherwise the video would slide
      // completely off-screen and the next video would look black.
      track.style.transition = "none";
      track.style.transform = "none";
    }

    function setGate(locked) {
      unlocked = !locked;
      gate.classList.toggle("show", locked);
    }

    function loadCurrentVideo(tryUnmuted = true) {
      const myToken = ++loadToken;
      changing = true;
      loading.classList.remove("hidden");
      errorBox.style.display = "none";

      video.pause();
      video.removeAttribute("src");
      video.load();

      // Feed starts UNMUTED. If the browser blocks unmuted autoplay,
      // we fall back to muted so the video still opens.
      video.muted = !tryUnmuted;
      video.src = videoUrls[currentIndex];
      video.load();

      const promise = video.play();

      if (promise) {
        promise.catch(() => {
          // Mobile browsers may block sound autoplay.
          video.muted = true;
          mute.textContent = "🔇";
          video.play().catch(() => {});
        });
      }

      setTimeout(() => {
        if (myToken === loadToken) changing = false;
      }, 150);
    }

    function goTo(index, animate = true) {
      if (index < 0 || index >= videoUrls.length || changing) return;
      currentIndex = index;
      updateTrack(animate);

      // The 5th, 10th, 15th... video is the stopping point.
      // The gate is only active when arriving there.
      if (isGateIndex(currentIndex)) {
        setGate(true);
      } else {
        setGate(false);
      }

      loadCurrentVideo(true);
    }

    video.addEventListener("loadeddata", () => {
      loading.classList.add("hidden");
    });

    video.addEventListener("canplay", () => {
      loading.classList.add("hidden");
    });

    video.addEventListener("playing", () => {
      loading.classList.add("hidden");
      errorBox.style.display = "none";
    });

    video.addEventListener("error", () => {
      loading.classList.add("hidden");
      errorBox.style.display = "block";
    });

    mute.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      video.muted = !video.muted;
      mute.textContent = video.muted ? "🔇" : "🔊";

      if (!video.paused) {
        video.play().catch(() => {});
      }
    });

    video.addEventListener("click", () => {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    });

    retry.addEventListener("click", (e) => {
      e.stopPropagation();
      loadCurrentVideo(true);
    });

    /*
      WATCH MORE:
      The important change is that the feed is unlocked permanently for
      the next videos immediately when the user clicks. The gate itself
      is removed before loading the next video, so it cannot remain stuck.
      Monetag receives the genuine click through its Onclick script.
    */
    watchMore.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();

      unlocked = true;
      normalFeed = true;
      gate.classList.remove("show");

      const next = currentIndex + 1;

      if (next < videoUrls.length) {
        currentIndex = next;
        updateTrack(true);

        // Continue unmuted after the user's click.
        setTimeout(() => {
          loadCurrentVideo(true);
        }, 120);
      }
    });

    // Strong phone swipe handler.
    // Listen on document capture so the swipe is detected even when
    // the video element or overlay is under the finger.
    document.addEventListener("touchstart", (e) => {
      if (!e.touches.length) return;
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
      dragging = false;
    }, { passive: true, capture: true });

    document.addEventListener("touchmove", () => {
      dragging = true;
    }, { passive: true, capture: true });

    document.addEventListener("touchend", (e) => {
      if (!e.changedTouches.length) return;

      const endY = e.changedTouches[0].clientY;
      const endX = e.changedTouches[0].clientX;
      const dy = endY - startY;
      const dx = endX - startX;

      if (!dragging || Math.abs(dy) < 45 || Math.abs(dy) <= Math.abs(dx)) return;

      // Locked only while Watch More is visible.
      if (!unlocked) return;

      if (dy < 0 && currentIndex < videoUrls.length - 1) {
        goTo(currentIndex + 1, true);
      } else if (dy > 0 && currentIndex > 0) {
        goTo(currentIndex - 1, true);
      }

      swipe.classList.add("hidden");
    }, { passive: true, capture: true });

    // Mouse wheel / trackpad.
    let wheelLock = false;
    app.addEventListener("wheel", (e) => {
      if (wheelLock || Math.abs(e.deltaY) < 30 || !unlocked) return;
      wheelLock = true;

      if (e.deltaY > 0 && currentIndex < videoUrls.length - 1) {
        goTo(currentIndex + 1, true);
      } else if (e.deltaY < 0 && currentIndex > 0) {
        goTo(currentIndex - 1, true);
      }

      setTimeout(() => wheelLock = false, 500);
    }, { passive: true });

    // Keyboard support on laptop.
    document.addEventListener("keydown", (e) => {
      if (!unlocked) return;

      if (e.key === "ArrowDown" && currentIndex < videoUrls.length - 1) {
        goTo(currentIndex + 1, true);
      } else if (e.key === "ArrowUp" && currentIndex > 0) {
        goTo(currentIndex - 1, true);
      }
    });

    // Keep the current slide correct after browser rotation/resize.
    window.addEventListener("resize", () => updateTrack(false));

    updateTrack(false);
    setTimeout(() => loadCurrentVideo(true), 50);
    setTimeout(() => swipe.classList.add("hidden"), 4000);
  </script>
