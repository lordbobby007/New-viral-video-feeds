const feed=document.getElementById("feed");
const slides=[...document.querySelectorAll(".slide")];
const video=document.getElementById("video");
const loading=document.getElementById("loading");
const err=document.getElementById("err");
const retry=document.getElementById("retry");
const mute=document.getElementById("mute");
const gate=document.getElementById("gate");
const watchMore=document.getElementById("watchMore");
const hint=document.getElementById("hint");

let index=0;
let muted=false;
let locked=false;
let unlockedThrough=0;
let loadingId=0;
let scrollEndTimer=0;

function isCheckpoint(i){
  return i>0 && (i+1)%5===0;
}

function mustLock(i){
  return isCheckpoint(i) && i>unlockedThrough;
}

function showGate(){
  locked=true;
  gate.classList.add("show");
}

function hideGate(){
  locked=false;
  gate.classList.remove("show");
}

function playCurrent(){
  video.muted=muted;
  const p=video.play();
  if(p) p.catch(()=>{
    video.muted=true;
    muted=true;
    mute.textContent="🔇";
    video.play().catch(()=>{});
  });
}

function load(i){
  if(i<0 || i>=urls.length) return;
  const my=++loadingId;
  index=i;
  loading.classList.remove("hidden");
  err.style.display="none";

  video.pause();
  video.removeAttribute("src");
  video.load();

  video.src=urls[i];
  video.load();

  video.onloadeddata=()=>{
    if(my!==loadingId) return;
    loading.classList.add("hidden");
    playCurrent();
  };

  video.oncanplay=()=>{
    if(my!==loadingId) return;
    loading.classList.add("hidden");
    playCurrent();
  };

  video.onerror=()=>{
    if(my!==loadingId) return;
    loading.classList.add("hidden");
    err.style.display="block";
  };
}

function currentFromScroll(){
  const h=feed.clientHeight || window.innerHeight;
  const next=Math.round(feed.scrollTop/h);
  if(next===index) return;
  if(next<0 || next>=urls.length) return;

  // Never allow native scroll to enter a locked checkpoint.
  if(mustLock(next)){
    feed.scrollTo({top:index*h,behavior:"auto"});
    showGate();
    return;
  }

  hideGate();
  load(next);
}

function goTo(i,smooth=true){
  if(i<0 || i>=urls.length || locked) return;
  if(mustLock(i)){
    showGate();
    return;
  }
  feed.scrollTo({
    top:i*(feed.clientHeight||window.innerHeight),
    behavior:smooth?"smooth":"auto"
  });
  load(i);
  hideGate();
}

feed.addEventListener("scroll",()=>{
  clearTimeout(scrollEndTimer);
  scrollEndTimer=setTimeout(currentFromScroll,90);
},{passive:true});

if("onscrollend" in window){
  feed.addEventListener("scrollend",currentFromScroll,{passive:true});
}

// Watch More = immediate unlock. Do NOT wait for ad close.
watchMore.addEventListener("click",e=>{
  e.preventDefault();
  e.stopPropagation();

  const next=index+1;
  unlockedThrough=Math.max(unlockedThrough,next);
  hideGate();

  if(next<urls.length){
    feed.scrollTo({
      top:next*(feed.clientHeight||window.innerHeight),
      behavior:"smooth"
    });
    load(next);
  }
});

mute.addEventListener("click",e=>{
  e.preventDefault();
  e.stopPropagation();
  muted=!muted;
  mute.textContent=muted?"🔇":"🔊";
  video.muted=muted;
  playCurrent();
});

video.addEventListener("click",()=>{
  if(video.paused) playCurrent();
  else video.pause();
});

retry.addEventListener("click",()=>load(index));

// Touch: let the browser perform the actual vertical swipe.
// We only snap to the nearest item after the gesture.
let sy=0,sx=0;
document.addEventListener("touchstart",e=>{
  if(e.touches[0]){
    sy=e.touches[0].clientY;
    sx=e.touches[0].clientX;
  }
},{passive:true,capture:true});

document.addEventListener("touchend",e=>{
  if(!e.changedTouches[0]) return;
  const dy=e.changedTouches[0].clientY-sy;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dy)<40 || Math.abs(dy)<=Math.abs(dx)) return;
  if(locked) return;

  const target=index+(dy<0?1:-1);
  if(target<0 || target>=urls.length) return;

  if(mustLock(target)){
    feed.scrollTo({top:index*(feed.clientHeight||window.innerHeight),behavior:"auto"});
    showGate();
    return;
  }

  goTo(target,true);
},{passive:true,capture:true});

// Desktop
let wheelLock=false;
feed.addEventListener("wheel",e=>{
  if(wheelLock || locked || Math.abs(e.deltaY)<15) return;
  e.preventDefault();
  wheelLock=true;
  goTo(index+(e.deltaY>0?1:-1),true);
  setTimeout(()=>wheelLock=false,550);
},{passive:false});

document.addEventListener("keydown",e=>{
  if(locked) return;
  if(e.key==="ArrowDown"||e.key==="PageDown") goTo(index+1,true);
  if(e.key==="ArrowUp"||e.key==="PageUp") goTo(index-1,true);
});

window.addEventListener("resize",()=>{
  feed.scrollTo({top:index*(feed.clientHeight||window.innerHeight),behavior:"auto"});
});

load(0);
setTimeout(()=>hint.classList.add("hidden"),4000);
</script>
