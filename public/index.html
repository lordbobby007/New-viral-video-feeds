<title>Viral Video Feeds</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#feed{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.slide{position:relative;width:100%;height:100dvh;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#gate{display:none;position:fixed;z-index:1000;left:0;right:0;top:0;bottom:0;align-items:center;justify-content:center;pointer-events:none}
#gate.show{display:flex}
#gateBox{pointer-events:none;text-align:center;background:rgba(0,0,0,.72);border-radius:14px;padding:18px 22px;color:#fff;max-width:90%;font-size:16px;font-weight:600;line-height:1.35}
#watch{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:999px;background:#fff;color:#000;font-weight:700;border:0;font-size:15px;pointer-events:auto}
#mute{position:fixed;z-index:1100;right:16px;bottom:18px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px}
#hint{position:fixed;z-index:1100;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:20px;font-size:13px}
.hidden{display:none!important}
</style>
</head>

</div>

  'https://primeexclusive.shop/wp-theme/videos/1%20(281).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(308).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(45).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(215).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(375).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(28).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(321).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(8).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(430).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(349).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(323).mp4'
];

// Random order every time the page opens/refreshed.
const urls=[...BASE_URLS].sort(()=>Math.random()-0.5);

const feed=document.getElementById('feed');
const gate=document.getElementById('gate');
const watch=document.getElementById('watch');
const mute=document.getElementById('mute');
const hint=document.getElementById('hint');

let current=0;
let muted=true;
let fifthTimer=null;
let fifthShown=-1;
let scrollTimer=null;

// Create one real video element per slide. This avoids moving a single player
// between slides, which caused the black-screen/playback problems.
const vids=urls.map((url,i)=>{
  const slide=document.createElement('section');
  slide.className='slide';
  slide.dataset.index=i;

  const v=document.createElement('video');
  v.playsInline=true;
  v.setAttribute('playsinline','');
  v.setAttribute('webkit-playsinline','');
  v.muted=true;
  v.loop=true;
  v.preload=i<2?'auto':'metadata';

  slide.appendChild(v);
  feed.appendChild(slide);
  return v;
});

function isFifth(i){
  return i>=4 && ((i+1)%5===0);
}

function hideGate(){
  gate.classList.remove('show');
}

function showGateForFourSeconds(i){
  if(!isFifth(i) || fifthShown===i) return;

  fifthShown=i;
  if(fifthTimer) clearTimeout(fifthTimer);

  // IMPORTANT: never pause the current video here.
  gate.classList.add('show');

  fifthTimer=setTimeout(()=>{
    fifthTimer=null;
    hideGate();
  },4000);
}

function ensureSource(i){
  const v=vids[i];
  if(!v) return;

  if(v.dataset.srcLoaded!=='1'){
    v.src=urls[i];
    v.dataset.srcLoaded='1';
    v.load();
  }
}

function playCurrent(i){
  const v=vids[i];
  if(!v || current!==i) return;

  v.muted=muted;
  v.loop=true;

  const p=v.play();
  if(p && p.catch){
    p.catch(()=>{
      // Mobile autoplay fallback: muted playback.
      v.muted=true;
      muted=true;
      mute.textContent='🔇';
      v.play().catch(()=>{});
    });
  }
}

function activate(i){
  if(i<0 || i>=urls.length) return;

  current=i;

  // Only stop videos that are no longer current.
  vids.forEach((v,n)=>{
    if(n!==i && !v.paused){
      v.pause();
    }
  });

  ensureSource(i);
  ensureSource(i+1);
  ensureSource(i-1);

  const v=vids[i];

  if(v.readyState>=2){
    playCurrent(i);
  }else{
    v.addEventListener('canplay',()=>playCurrent(i),{once:true});
    v.addEventListener('loadeddata',()=>playCurrent(i),{once:true});
  }

  // Purely visual 4-second prompt on every fifth video.
  showGateForFourSeconds(i);

  hint.classList.add('hidden');
}

function goTo(i){
  if(i<0 || i>=urls.length) return;
  feed.scrollTo({top:i*feed.clientHeight,behavior:'smooth'});
}

// Native scroll-snap is the primary navigation.
feed.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const i=Math.max(0,Math.min(
      urls.length-1,
      Math.round(feed.scrollTop/feed.clientHeight)
    ));
    if(i!==current) activate(i);
  },80);
},{passive:true});

// Extra swipe support for Telegram/mobile WebViews.
let startY=0,startX=0;
document.addEventListener('touchstart',e=>{
  if(!e.touches[0]) return;
  startY=e.touches[0].clientY;
  startX=e.touches[0].clientX;
},{passive:true,capture:true});

document.addEventListener('touchend',e=>{
  if(!e.changedTouches[0]) return;
  const dy=e.changedTouches[0].clientY-startY;
  const dx=e.changedTouches[0].clientX-startX;

  if(Math.abs(dy)<45 || Math.abs(dy)<=Math.abs(dx)) return;

  const target=current+(dy<0?1:-1);
  if(target>=0 && target<urls.length) goTo(target);
},{passive:true,capture:true});

// Desktop wheel navigation.
let wheelBusy=false;
feed.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)<20 || wheelBusy) return;
  wheelBusy=true;
  goTo(current+(e.deltaY>0?1:-1));
  setTimeout(()=>wheelBusy=false,550);
},{passive:true});

// Keyboard navigation.
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown' || e.key==='PageDown'){
    e.preventDefault();
    goTo(current+1);
  }else if(e.key==='ArrowUp' || e.key==='PageUp'){
    e.preventDefault();
    goTo(current-1);
  }
});

// Mute button.
mute.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();

  muted=!muted;
  mute.textContent=muted?'🔇':'🔊';

  const v=vids[current];
  if(v){
    v.muted=muted;
    if(v.paused) v.play().catch(()=>{});
  }
});

// Watch More is just a button displayed during the 4-second prompt.
// It NEVER controls feed playback.
watch.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
});

// If the app returns from background, restart the current video normally.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    setTimeout(()=>{
      ensureSource(current);
      playCurrent(current);
    },100);
  }
});

// Start first video.
activate(0);
</script>
