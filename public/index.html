<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#feed{width:100%;height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-snap-stop:always;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.slide{position:relative;width:100%;height:100vh;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;display:flex;align-items:center;justify-content:center}
.slide video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.gate{flex-direction:column;gap:18px;background:#000;color:#fff;text-align:center;padding:24px;user-select:none}
.watch-button{border:0;border-radius:999px;padding:13px 24px;font-size:16px;font-weight:700;background:#fff;color:#000;cursor:pointer;touch-action:manipulation}
.swipe-message{display:none;max-width:310px;font-size:18px;line-height:1.45;font-weight:700}
.gate.ready .watch-button{display:none}
.gate.ready .swipe-message{display:block}
#mute{position:fixed;z-index:2000;right:16px;bottom:18px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px}
#hint{position:fixed;z-index:2000;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:20px;font-size:13px}
.hidden{display:none!important}
</style>
</head>

  'https://primeexclusive.shop/wp-theme/videos/1%20(215).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(375).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(28).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(321).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(8).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(430).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(349).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(323).mp4'
];

const urls=[...BASE_URLS].sort(()=>Math.random()-0.5);

const feed=document.getElementById('feed');
const mute=document.getElementById('mute');
const hint=document.getElementById('hint');

let current=0;
let muted=true;
let scrollTimer=null;
let gateTimer=null;
let gateToken=0;

const items=[];
for(let i=0;i<urls.length;i++){
  items.push({type:'video',url:urls[i],number:i+1});
  if((i+1)%5===0 && i<urls.length-1){
    items.push({type:'gate',after:i+1});
  }
}

const players=new Array(items.length);

for(let i=0;i<items.length;i++){
  const item=items[i];
  const slide=document.createElement('section');
  slide.className='slide';
  slide.dataset.itemIndex=i;

  if(item.type==='video'){
    const v=document.createElement('video');
    v.playsInline=true;
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    v.muted=true;
    v.loop=true;
    v.preload=i<2?'auto':'metadata';
    slide.appendChild(v);
    players[i]=v;
  }else{
    slide.classList.add('gate');
    slide.innerHTML='<button class="watch-button" type="button">Watch More</button><div class="swipe-message">Swipe up to watch videos<br>Unlocked more videos</div>';

    const btn=slide.querySelector('.watch-button');

    btn.addEventListener('click',e=>{
      // Monetag Onclick can use this user click. This button does not
      // navigate or pause/unpause any video.
      e.stopPropagation();
    });

    slide.addEventListener('gateenter',()=>{
      const token=++gateToken;
      slide.classList.remove('ready');
      if(gateTimer) clearTimeout(gateTimer);
      gateTimer=setTimeout(()=>{
        if(token===gateToken) slide.classList.add('ready');
      },4000);
    });
  }

  feed.appendChild(slide);
}

function loadVideo(i){
  const v=players[i];
  const item=items[i];
  if(!v || !item || item.type!=='video') return;

  if(v.dataset.loaded!=='1'){
    v.src=item.url;
    v.dataset.loaded='1';
    v.load();
  }
}

function playVideo(i){
  const v=players[i];
  if(!v || current!==i) return;

  v.muted=muted;
  v.loop=true;
  v.playsInline=true;

  const p=v.play();
  if(p && p.catch){
    p.catch(()=>{
      v.muted=true;
      muted=true;
      mute.textContent='🔇';
      v.play().catch(()=>{});
    });
  }
}

function activate(i){
  if(i<0 || i>=items.length) return;

  current=i;

  // Stop only videos that are not the currently visible item.
  players.forEach((v,n)=>{
    if(v && n!==i && !v.paused) v.pause();
  });

  const item=items[i];

  if(item.type==='video'){
    loadVideo(i);
    loadVideo(i-1);
    loadVideo(i+1);

    const v=players[i];
    if(v.readyState>=2) playVideo(i);
    else v.addEventListener('canplay',()=>playVideo(i),{once:true});
  }else{
    // This is a REAL blank scroll-snap screen.
    // No video is paused by this gate itself; the previous video is simply
    // no longer the current screen. The next video starts after swipe-up.
    feed.children[i].dispatchEvent(new Event('gateenter'));
  }

  hint.classList.add('hidden');
}

function goTo(i){
  if(i<0 || i>=items.length) return;
  feed.scrollTo({top:i*feed.clientHeight,behavior:'smooth'});
}

// Native scroll-snap is the primary navigation.
feed.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const i=Math.max(0,Math.min(items.length-1,Math.round(feed.scrollTop/feed.clientHeight)));
    if(i!==current) activate(i);
  },60);
},{passive:true});

// Simple touch swipe fallback. It never blocks scrolling.
let startY=0;
let startX=0;

feed.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  startY=e.touches[0].clientY;
  startX=e.touches[0].clientX;
},{passive:true});

feed.addEventListener('touchend',e=>{
  if(!e.changedTouches[0]) return;

  const dy=e.changedTouches[0].clientY-startY;
  const dx=e.changedTouches[0].clientX-startX;

  if(Math.abs(dy)<45 || Math.abs(dy)<=Math.abs(dx)) return;

  const target=current+(dy<0?1:-1);
  if(target>=0 && target<items.length) goTo(target);
},{passive:true});

// Desktop wheel.
let wheelBusy=false;
feed.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)<20 || wheelBusy) return;
  wheelBusy=true;
  goTo(current+(e.deltaY>0?1:-1));
  setTimeout(()=>wheelBusy=false,500);
},{passive:true});

// Keyboard.
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown' || e.key==='PageDown'){
    e.preventDefault();
    goTo(current+1);
  }else if(e.key==='ArrowUp' || e.key==='PageUp'){
    e.preventDefault();
    goTo(current-1);
  }
});

// Mute.
mute.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
  muted=!muted;
  mute.textContent=muted?'🔇':'🔊';
  const v=players[current];
  if(v){
    v.muted=muted;
    if(v.paused) v.play().catch(()=>{});
  }
});

// Return from background.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && items[current].type==='video'){
    setTimeout(()=>playVideo(current),100);
  }
});

activate(0);
</script>
