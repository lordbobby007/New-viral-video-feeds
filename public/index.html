const feed = document.getElementById("feed");
const slides = [...document.querySelectorAll(".slide")];
const players = slides.map(s => s.querySelector(".player"));
const muteBtn = document.getElementById("mute");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const retryBtn = document.getElementById("retry");
const gate = document.getElementById("gate");
const watchMore = document.getElementById("watchMore");
const hint = document.getElementById("hint");

let current = 0;
let muted = false;
let locked = false;
let highestUnlocked = 0;
let loadingToken = 0;
let scrollTimer = null;
let programmatic = false;

function checkpoint(i) {
  return i > 0 && (i + 1) % 5 === 0;
}

function shouldLock(i) {
  return checkpoint(i) && i > highestUnlocked;
}

function showGate() {
  locked = true;
  gate.classList.add("show");
}

function hideGate() {
  locked = false;
  gate.classList.remove("show");
}

function setPlayer(v, url, active) {
  v.pause();
  v.removeAttribute("src");
  v.load();
  v.src = url;
  v.muted = muted;
  v.loop = true;
  v.playsInline = true;
  v.setAttribute("playsinline","");
  v.setAttribute("webkit-playsinline","");
  if (active) {
    const p = v.play();
    if (p) p.catch(() => {
      // Audible autoplay can be blocked by mobile browsers.
      v.muted = true;
      muted = true;
      muteBtn.textContent = "🔇";
      v.play().catch(() => {});
    });
  }
}

function loadAround(i) {
  const token = ++loadingToken;
  loading.classList.remove("hidden");
  errorBox.style.display = "none";

  for (let k=0;k<3;k++) {
    const target = i + (k-1);
    const v = players[k];
    if (target < 0 || target >= videoUrls.length) {
      v.pause();
      v.removeAttribute("src");
      v.load();
      continue;
    }
    setPlayer(v, videoUrls[target], target === i);
  }

  setTimeout(() => {
    if (token === loadingToken) loading.classList.add("hidden");
  }, 1800);
}

function updateFromScroll() {
  const h = Math.max(1, feed.clientHeight);
  let index = Math.round(feed.scrollTop / h);
  index = Math.max(0, Math.min(videoUrls.length - 1, index));
  if (index === current) return;

  current = index;
  loadAround(current);

  if (shouldLock(current)) showGate();
  else hideGate();

  hint.classList.add("hidden");
}

function goTo(index, smooth=true) {
  if (index < 0 || index >= videoUrls.length || locked) return;
  current = index;
  programmatic = true;
  feed.scrollTo({
    top:index * feed.clientHeight,
    behavior:smooth ? "smooth" : "auto"
  });
  loadAround(index);
  if (shouldLock(index)) showGate(); else hideGate();
  hint.classList.add("hidden");
  setTimeout(() => programmatic=false, 600);
}

feed.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(updateFromScroll, 80);
}, {passive:true});

feed.addEventListener("scrollend", updateFromScroll, {passive:true});

players.forEach((v,slot) => {
  v.addEventListener("playing", () => {
    if (slot === 1) loading.classList.add("hidden");
  });
  v.addEventListener("error", () => {
    if (slot === 1) {
      loading.classList.add("hidden");
      errorBox.style.display = "block";
    }
  });
  v.addEventListener("click", () => {
    if (slot !== 1) return;
    if (v.paused) v.play().catch(() => {});
    else v.pause();
  });
});

muteBtn.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  const active = players[1];
  active.muted = muted;
  active.play().catch(() => {});
});

retryBtn.addEventListener("click", e => {
  e.stopPropagation();
  loadAround(current);
});

/*
  The Watch More button is the user interaction that triggers Monetag
  Onclick. We unlock BEFORE moving the feed, so the feed never depends
  on detecting whether the popunder was closed.
*/
watchMore.addEventListener("click", e => {
  e.preventDefault();
  e.stopPropagation();

  const next = current + 1;
  highestUnlocked = Math.max(highestUnlocked, next);
  hideGate();

  if (next < videoUrls.length) {
    goTo(next, true);
  }
});

// Extra touch handling makes the native scroll-snap feel like Reels
// even inside Telegram's WebView. We let the browser do the vertical
// movement and only correct it when the finger is released.
let sy=0, sx=0, moved=false, touchStartTime=0;

document.addEventListener("touchstart", e => {
  if (!e.touches[0]) return;
  sy=e.touches[0].clientY;
  sx=e.touches[0].clientX;
  moved=false;
  touchStartTime=Date.now();
}, {passive:true,capture:true});

document.addEventListener("touchmove", e => {
  if (!e.touches[0]) return;
  const dy=e.touches[0].clientY-sy;
  const dx=e.touches[0].clientX-sx;
  if (Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)) moved=true;
}, {passive:true,capture:true});

document.addEventListener("touchend", e => {
  if (!e.changedTouches[0] || !moved) return;
  const ey=e.changedTouches[0].clientY;
  const ex=e.changedTouches[0].clientX;
  const dy=ey-sy;
  const dx=ex-sx;

  if (Math.abs(dy)<35 || Math.abs(dy)<=Math.abs(dx)) return;

  if (locked) return;

  const direction = dy < 0 ? 1 : -1;
  const target = current + direction;

  if (target >= 0 && target < videoUrls.length) {
    goTo(target, true);
  }
}, {passive:true,capture:true});

// Desktop wheel / keyboard
let wheelBusy=false;
feed.addEventListener("wheel", e => {
  if (wheelBusy || locked || Math.abs(e.deltaY)<20) return;
  e.preventDefault();
  wheelBusy=true;
  goTo(current + (e.deltaY>0 ? 1 : -1), true);
  setTimeout(()=>wheelBusy=false,500);
}, {passive:false});

document.addEventListener("keydown", e => {
  if (locked) return;
  if (e.key==="ArrowDown" || e.key==="PageDown") goTo(current+1,true);
  if (e.key==="ArrowUp" || e.key==="PageUp") goTo(current-1,true);
});

window.addEventListener("resize", () => {
  feed.scrollTo({top:current*feed.clientHeight,behavior:"auto"});
});

// Initial state
loadAround(0);
setTimeout(() => {
  feed.scrollTo({top:0,behavior:"auto"});
  players[1].play().catch(() => {
    players[1].muted=true;
    muted=true;
    muteBtn.textContent="🔇";
    players[1].play().catch(() => {});
  });
}, 100);
setTimeout(() => hint.classList.add("hidden"), 4000);
</script>
