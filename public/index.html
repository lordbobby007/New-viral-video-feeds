<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viral Video Feeds</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#topButtons{
  position:fixed;
  z-index:2500;
  top:calc(env(safe-area-inset-top) + 10px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  padding:4px;
  border-radius:24px;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.category{
  border:0;
  border-radius:20px;
  padding:8px 15px;
  color:#fff;
  background:transparent;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}
.category.active{
  background:#fff;
  color:#000;
}
#feed{
  width:100%;height:100vh;overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;scroll-snap-stop:always;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  touch-action:pan-y;
}
.slide{
  position:relative;width:100%;height:100vh;min-height:100vh;
  scroll-snap-align:start;scroll-snap-stop:always;
  background:#000;display:flex;align-items:center;justify-content:center;
}
.slide video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#mute{
  position:fixed;z-index:2000;right:16px;bottom:18px;width:44px;height:44px;
  border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px
}
#brand{
  position:fixed;
  z-index:2000;
  left:14px;
  bottom:18px;
  color:#fff;
  font-size:15px;
  font-weight:600;
  line-height:1;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  pointer-events:none;
}
#swipeHint{
  position:fixed;
  z-index:2100;
  left:50%;
  bottom:58px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  color:#fff;
  font-size:17px;
  font-weight:700;
  text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.9);
  pointer-events:none;
  animation:hintFade 5s ease-in-out forwards;
}
.swipe-arrow{
  display:block;
  font-size:34px;
  line-height:24px;
  animation:swipeArrow 1s ease-in-out infinite;
}
@keyframes swipeArrow{
  0%,100%{transform:translateY(7px);opacity:.45}
  50%{transform:translateY(-5px);opacity:1}
}
@keyframes hintFade{
  0%{opacity:0;transform:translate(-50%,12px)}
  12%{opacity:1;transform:translate(-50%,0)}
  78%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-4px)}
}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="topButtons">
  <button class="category active" type="button">Desi Videos</button>
  <button class="category" type="button">English Videos</button>
</div>
<div id="feed"></div>
<div id="brand">Viral Feeds</div>
<div id="swipeHint"><span class="swipe-arrow">↑</span><span>Swipe up to watch more</span></div>
<button id="mute" type="button" aria-label="Mute or unmute">🔇</button>
<div id="hint">Swipe up for next video</div>

// Your uploaded video in /public.
// IMPORTANT: keep this filename exactly the same in the public folder.
const INSERTED_VIDEO_URL='/WhatsApp%20Video%202026-09-13%20at%2011.53.01%20PM.mp4';

// Randomize ONLY the normal videos. The uploaded video stays after every
// group of five normal videos.
const shuffled=[...NORMAL_URLS];
for(let i=shuffled.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
}

// Sequence:
// normal 1-5 -> your uploaded video -> normal 6-10 -> your uploaded video...
const items=[];
for(let i=0;i<shuffled.length;i++){
  items.push({type:'normal',url:shuffled[i],normalNumber:i+1});
  if((i+1)%5===0 && i<shuffled.length-1){
    items.push({type:'inserted',url:INSERTED_VIDEO_URL});
  }
}

const feed=document.getElementById('feed');
const mute=document.getElementById('mute');
const categoryButtons=document.querySelectorAll('.category');

categoryButtons.forEach(button=>{
  button.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    categoryButtons.forEach(b=>b.classList.remove('active'));
    button.classList.add('active');
  });
});



let current=0;
let muted=true;
let scrollTimer=null;
const players=new Array(items.length);

items.forEach((item,i)=>{
  const slide=document.createElement('section');
  slide.className='slide';
  slide.dataset.index=i;

  const v=document.createElement('video');
  v.playsInline=true;
  v.setAttribute('playsinline','');
  v.setAttribute('webkit-playsinline','');
  v.muted=true;
  v.loop=true;
  v.preload=i<2?'auto':'metadata';

  slide.appendChild(v);
  feed.appendChild(slide);
  players[i]=v;
});

function load(i){
  if(i<0 || i>=items.length) return;
  const v=players[i];
  if(!v) return;

  if(v.dataset.loaded!=='1'){
    v.src=items[i].url;
    v.dataset.loaded='1';
    v.load();
  }
}

function playCurrent(i){
  const v=players[i];
  if(!v || current!==i) return;

  v.muted=muted;
  v.loop=true;

  const p=v.play();
  if(p && p.catch){
    p.catch(()=>{
      // Keep autoplay compatible with Telegram/mobile browsers.
      v.muted=true;
      muted=true;
      mute.textContent='🔇';
      v.play().catch(()=>{});
    });
  }
}

function activate(i){
  if(i<0 || i>=items.length) return;

  current=i;

  // Only the currently visible video plays.
  players.forEach((v,n)=>{
    if(v && n!==i && !v.paused) v.pause();
  });

  load(i);
  load(i-1);
  load(i+1);

  const v=players[i];
  if(v.readyState>=2){
    playCurrent(i);
  }else{
    v.addEventListener('canplay',()=>playCurrent(i),{once:true});
    v.addEventListener('loadeddata',()=>playCurrent(i),{once:true});
  }

}

function goTo(i){
  if(i<0 || i>=items.length || i===current) return;
  feed.scrollTo({
    top:i*feed.clientHeight,
    behavior:'smooth'
  });
}

// Native TikTok-style scroll snapping.
feed.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const i=Math.max(0,Math.min(
      items.length-1,
      Math.round(feed.scrollTop/feed.clientHeight)
    ));
    if(i!==current) activate(i);
  },60);
},{passive:true});

// Mobile / Telegram WebView swipe.
let startY=0;
let startX=0;

document.addEventListener('touchstart',e=>{
  if(!e.touches || e.touches.length!==1) return;
  startY=e.touches[0].clientY;
  startX=e.touches[0].clientX;
},{passive:true,capture:true});

document.addEventListener('touchend',e=>{
  if(!e.changedTouches || !e.changedTouches[0]) return;

  const dy=e.changedTouches[0].clientY-startY;
  const dx=e.changedTouches[0].clientX-startX;

  if(Math.abs(dy)<35 || Math.abs(dy)<=Math.abs(dx)) return;

  const target=current+(dy<0?1:-1);
  if(target>=0 && target<items.length){
    goTo(target);
  }
},{passive:true,capture:true});

// Desktop wheel.
let wheelBusy=false;
feed.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)<20 || wheelBusy) return;
  wheelBusy=true;
  goTo(current+(e.deltaY>0?1:-1));
  setTimeout(()=>wheelBusy=false,500);
},{passive:true});

// Keyboard.
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown' || e.key==='PageDown'){
    e.preventDefault();
    goTo(current+1);
  }else if(e.key==='ArrowUp' || e.key==='PageUp'){
    e.preventDefault();
    goTo(current-1);
  }
});

// Mute.
mute.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();

  muted=!muted;
  mute.textContent=muted?'🔇':'🔊';

  const v=players[current];
  if(v){
    v.muted=muted;
    if(v.paused) v.play().catch(()=>{});
  }
});

// Resume current video after returning from background.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && items[current]){
    setTimeout(()=>playCurrent(current),100);
  }
});

activate(0);
</script>
