<script>
const baseUrls=[
  'https://primeexclusive.shop/wp-theme/videos/1%20(445).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(405).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(117).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(219).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(124).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(434).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(268).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(81).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(426).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(311).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(248).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(372).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(220).mp4'
];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const urls=shuffle([...baseUrls]);

const feed=document.getElementById('feed');
const vids=[...document.querySelectorAll('.v')];
const status=document.getElementById('status');
const gate=document.getElementById('gate');
const watch=document.getElementById('watch');
const mute=document.getElementById('mute');
const hint=document.getElementById('hint');

let current=0;
let muted=false;
let pauseTimer=null;
let lastTimedPause=-1;
let isAdPaused=false;

function isFifthVideo(i){
  return i >= 4 && ((i + 1) % 5 === 0);
}

function gateOn(){
  gate.classList.add('show');
}
function gateOff(){
  gate.classList.remove('show');
}

function triggerAdPause(i) {
  if (!isFifthVideo(i) || lastTimedPause === i) return;

  lastTimedPause = i;
  isAdPaused = true;

  const currentVid = vids[i];
  if (currentVid) {
    currentVid.pause();
  }

  gateOn();

  if (pauseTimer) clearTimeout(pauseTimer);

  pauseTimer = setTimeout(() => {
    resumeVideoFeed();
  }, 4000);
}

function resumeVideoFeed() {
  if (pauseTimer) {
    clearTimeout(pauseTimer);
    pauseTimer = null;
  }

  gateOff();
  isAdPaused = false;

  const currentVid = vids[current];
  if (currentVid) {
    currentVid.muted = muted;
    const playPromise = currentVid.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        currentVid.muted = true;
        muted = true;
        mute.textContent = '🔇';
        currentVid.play().catch(() => {});
      });
    }
  }
}

function preload(i){
  if(i<0||i>=urls.length) return;
  const v=vids[i];
  if(!v || v.dataset.loaded==='1') return;
  v.src=urls[i];
  v.preload='metadata';
  v.load();
  v.dataset.loaded='1';
}

function activate(i){
  if(i<0||i>=urls.length) return;

  current=i;

  vids.forEach((v,n)=>{
    if(n!==i){
      try{v.pause()}catch(e){}
    }
  });

  const v = vids[i];
  if(!v) return;

  if(v.dataset.loaded!=='1'){
    v.src=urls[i];
    v.dataset.loaded='1';
    v.load();
  }

  v.muted=muted;
  v.loop=true;
  v.playsInline=true;

  if (isFifthVideo(i) && lastTimedPause !== i) {
    triggerAdPause(i);
  } else {
    const playCurrent=()=>{
      if(current!==i || isAdPaused) return;
      v.muted=muted;
      v.play().catch(()=>{
        v.muted=true;
        muted=true;
        mute.textContent='🔇';
        v.play().catch(()=>{});
      });
    };

    if(v.readyState>=2) playCurrent();
    else v.addEventListener('canplay',playCurrent,{once:true});
  }

  preload(i+1);
  preload(i-1);

  hint.classList.add('hidden');
}

let scrollTimer;
feed.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const i=Math.max(0,Math.min(
      urls.length-1,
      Math.round(feed.scrollTop/feed.clientHeight)
    ));

    if(i===current) return;
    activate(i);
  },80);
},{passive:true});

let swipeStartY=0;
let swipeStartX=0;
let swipeActive=false;

document.addEventListener('touchstart',e=>{
  if(!e.touches[0]) return;
  swipeStartY=e.touches[0].clientY;
  swipeStartX=e.touches[0].clientX;
  swipeActive=false;
},{passive:true,capture:true});

document.addEventListener('touchmove',e=>{
  if(!e.touches[0]) return;
  const dy=e.touches[0].clientY-swipeStartY;
  const dx=e.touches[0].clientX-swipeStartX;

  if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){
    swipeActive=true;
  }
},{passive:true,capture:true});

document.addEventListener('touchend',e=>{
  if(!e.changedTouches[0] || !swipeActive) return;

  const dy=e.changedTouches[0].clientY-swipeStartY;
  const dx=e.changedTouches[0].clientX-swipeStartX;

  if(Math.abs(dy)<35 || Math.abs(dy)<=Math.abs(dx)) return;

  const target=current+(dy<0 ? 1 : -1);
  if(target<0 || target>=urls.length) return;

  current=target;
  feed.scrollTo({
    top:target*feed.clientHeight,
    behavior:'smooth'
  });
  activate(target);
},{passive:true,capture:true});

watch.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
  resumeVideoFeed();
});

mute.addEventListener('click',e=>{
 e.preventDefault();
 e.stopPropagation();
 muted=!muted;
 mute.textContent=muted?'🔇':'🔊';
 const v=vids[current];
 if(v && !isAdPaused){
   v.muted=muted;
   v.play().catch(()=>{});
 }
});

vids.forEach((v,i)=>{
 v.addEventListener('click',()=>{
   if(i!==current || isAdPaused) return;
   if(v.paused) v.play().catch(()=>{});
   else v.pause();
 });
});

document.addEventListener('visibilitychange',()=>{
 if(!document.hidden && !isAdPaused) activate(current);
});

window.addEventListener('resize',()=>{
 feed.scrollTo({top:current*feed.clientHeight,behavior:'auto'});
});

activate(0);
setTimeout(()=>hint.classList.add('hidden'),4000);
</script>
