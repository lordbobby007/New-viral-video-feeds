<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Viral Video Feeds</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #feed {
      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;

      overscroll-behavior-y: contain;

      scrollbar-width: none;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    .video-page {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      flex-shrink: 0;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      background: #000;

      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      background: #000;
    }

    /* Top title */

    .top-title {
      position: fixed;

      top: 16px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 50;

      color: #fff;

      font-size: 17px;
      font-weight: 700;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.8);

      pointer-events: none;
    }

    /* Bottom information */

    .info {
      position: absolute;

      left: 18px;
      bottom: 24px;

      z-index: 20;

      max-width: 75%;

      color: white;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .author {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .caption {
      font-size: 14px;
      line-height: 1.4;
    }

    /* Buttons */

    .controls {
      position: absolute;

      right: 16px;
      bottom: 20px;

      z-index: 30;

      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .control-button {
      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.6);

      color: white;

      font-size: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      backdrop-filter: blur(5px);
    }

    .control-button:active {
      transform: scale(0.94);
    }

    /* Pause icon */

    .pause-overlay {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 15;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.6);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 32px;

      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    /* Swipe hint */

    #swipeHint {
      position: fixed;

      left: 50%;
      bottom: 35px;

      transform: translateX(-50%);

      z-index: 100;

      color: white;

      text-align: center;

      pointer-events: none;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9);

      transition: opacity 0.5s ease;
    }

    #swipeArrow {
      font-size: 34px;

      animation: bounce 1.2s infinite;
    }

    #swipeText {
      margin-top: 4px;

      font-size: 14px;
      font-weight: 600;
    }

    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Loading */

    #loading {
      position: fixed;

      inset: 0;

      z-index: 200;

      background: #000;

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 18px;

      transition: opacity 0.4s ease;
    }

    /* Desktop */

    @media (min-width: 768px) {
      .video-page {
        background: #000;
      }

      video {
        object-fit: contain;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    Loading videos...
  </div>

  <div class="top-title">
    Viral Video Feeds
  </div>

  <div id="feed"></div>

  <div id="swipeHint">
    <div id="swipeArrow">↑</div>
    <div id="swipeText">Swipe up for next video</div>
  </div>

  <script>

    /*
     * VIDEO LIST
     *
     * These are safe public sample videos.
     * You can replace these URLs later with videos
     * that you have permission to publish.
     */

    const videoUrls = [

      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMob.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerScape.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",

      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",

      "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"

    ];


    /*
     * SHUFFLE
     */

    function shuffle(array) {

      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] =
          [copy[j], copy[i]];

      }

      return copy;
    }


    /*
     * GLOBAL STATE
     */

    let videos = shuffle(videoUrls);

    let activeIndex = 0;

    let muted = true;


    /*
     * CREATE FEED
     */

    const feed =
      document.getElementById("feed");


    function createVideoPage(src, index) {

      const page =
        document.createElement("div");

      page.className = "video-page";

      page.dataset.index = index;


      const video =
        document.createElement("video");

      video.src = src;

      video.muted = true;

      video.defaultMuted = true;

      video.playsInline = true;

      video.loop = true;

      video.preload =
        index <= 1 ? "auto" : "metadata";


      video.setAttribute(
        "playsinline",
        ""
      );

      video.setAttribute(
        "webkit-playsinline",
        ""
      );


      /*
       * TAP VIDEO TO PLAY / PAUSE
       */

      page.addEventListener(
        "click",
        function(event) {

          /*
           * Don't pause when clicking buttons.
           */

          if (
            event.target.closest(
              ".control-button"
            )
          ) {
            return;
          }


          if (video.paused) {

            video.play()
              .then(() => {

                pauseIcon.classList.add(
                  "hidden"
                );

              })
              .catch(() => {});

          } else {

            video.pause();

            pauseIcon.classList.remove(
              "hidden"
            );

          }

        }
      );


      /*
       * INFO
       */

      const info =
        document.createElement("div");

      info.className = "info";

      info.innerHTML = `
        <div class="author">@viralvideos</div>
        <div class="caption">
          Watch. Swipe. Repeat. 🔥
        </div>
      `;


      /*
       * CONTROLS
       */

      const controls =
        document.createElement("div");

      controls.className = "controls";


      /*
       * SOUND BUTTON
       */

      const soundButton =
        document.createElement("button");

      soundButton.className =
        "control-button";

      soundButton.type =
        "button";

      soundButton.innerHTML =
        "🔇";

      soundButton.setAttribute(
        "aria-label",
        "Toggle sound"
      );


      soundButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          muted = !muted;

          /*
           * Apply sound setting to
           * every video.
           */

          document
            .querySelectorAll("video")
            .forEach(function(v) {

              v.muted = muted;

            });


          soundButton.innerHTML =
            muted ? "🔇" : "🔊";

        }
      );


      /*
       * PLAY / PAUSE BUTTON
       */

      const playButton =
        document.createElement("button");

      playButton.className =
        "control-button";

      playButton.type =
        "button";

      playButton.innerHTML =
        "❚❚";

      playButton.setAttribute(
        "aria-label",
        "Play or pause"
      );


      playButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();


          if (video.paused) {

            video.play()
              .then(() => {

                playButton.innerHTML =
                  "❚❚";

                pauseIcon.classList.add(
                  "hidden"
                );

              })
              .catch(() => {});

          } else {

            video.pause();

            playButton.innerHTML =
              "▶";

            pauseIcon.classList.remove(
              "hidden"
            );

          }

        }
      );


      controls.appendChild(
        soundButton
      );

      controls.appendChild(
        playButton
      );


      /*
       * PAUSE OVERLAY
       */

      const pauseIcon =
        document.createElement("div");

      pauseIcon.className =
        "pause-overlay hidden";

      pauseIcon.innerHTML =
        "▶";


      /*
       * VIDEO EVENTS
       */

      video.addEventListener(
        "play",
        function() {

          playButton.innerHTML =
            "❚❚";

          pauseIcon.classList.add(
            "hidden"
          );

        }
      );


      video.addEventListener(
        "pause",
        function() {

          if (index === activeIndex) {

            playButton.innerHTML =
              "▶";

            pauseIcon.classList.remove(
              "hidden"
            );

          }

        }
      );


      /*
       * ERROR HANDLING
       */

      video.addEventListener(
        "error",
        function() {

          console.log(
            "Video could not load:",
            src
          );

        }
      );


      page.appendChild(video);

      page.appendChild(
        pauseIcon
      );

      page.appendChild(
        info
      );

      page.appendChild(
        controls
      );


      return page;
    }


    /*
     * BUILD ALL VIDEOS
     */

    videos.forEach(
      function(src, index) {

        feed.appendChild(
          createVideoPage(
            src,
            index
          )
        );

      }
    );


    /*
     * GET VIDEO ELEMENTS
     */

    function getVideos() {

      return Array.from(
        feed.querySelectorAll(
          "video"
        )
      );

    }


    /*
     * PLAY ACTIVE VIDEO
     */

    function playActiveVideo() {

      const allVideos =
        getVideos();


      allVideos.forEach(
        function(video, index) {

          if (index === activeIndex) {

            video.muted = muted;

            video.play()
              .catch(() => {});

          } else {

            video.pause();

          }

        }
      );

    }


    /*
     * ACTIVE VIDEO DETECTION
     */

    const observer =
      new IntersectionObserver(
        function(entries) {

          let bestEntry = null;

          let bestRatio = 0;


          entries.forEach(
            function(entry) {

              if (
                entry.isIntersecting &&
                entry.intersectionRatio >
                  bestRatio
              ) {

                bestEntry = entry;

                bestRatio =
                  entry.intersectionRatio;

              }

            }
          );


          if (bestEntry) {

            const index =
              Number(
                bestEntry
                  .target
                  .dataset
                  .index
              );


            if (
              !Number.isNaN(index) &&
              index !== activeIndex
            ) {

              activeIndex = index;

              playActiveVideo();

            }

          }

        },
        {
          root: feed,

          threshold: [
            0.6,
            0.8,
            0.95
          ]
        }
      );


    /*
     * OBSERVE PAGES
     */

    document
      .querySelectorAll(".video-page")
      .forEach(
        function(page) {

          observer.observe(page);

        }
      );


    /*
     * START FIRST VIDEO
     */

    window.setTimeout(
      function() {

        playActiveVideo();

        const loading =
          document.getElementById(
            "loading"
          );

        loading.style.opacity = "0";


        window.setTimeout(
          function() {

            loading.remove();

          },
          500
        );

      },
      300
    );


    /*
     * SWIPE HINT
     */

    window.setTimeout(
      function() {

        const hint =
          document.getElementById(
            "swipeHint"
          );

        hint.style.opacity = "0";


        window.setTimeout(
          function() {

            hint.remove();

          },
          600
        );

      },
      4000
    );


    /*
     * PAGE VISIBILITY
     *
     * If the user leaves the page
     * and comes back, resume the
     * active video.
     */

    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          getVideos().forEach(
            function(video) {

              video.pause();

            }
          );

        } else {

          window.setTimeout(
            function() {

              playActiveVideo();

            },
            200
          );

        }

      }
    );


    /*
     * KEYBOARD SUPPORT
     *
     * Useful on laptop.
     */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "ArrowDown"
        ) {

          event.preventDefault();

          const next =
            Math.min(
              activeIndex + 1,
              videos.length - 1
            );


          feed.children[next]
            .scrollIntoView({
              behavior: "smooth"
            });

        }


        if (
          event.key === "ArrowUp"
        ) {

          event.preventDefault();

          const previous =
            Math.max(
              activeIndex - 1,
              0
            );


          feed.children[previous]
            .scrollIntoView({
              behavior: "smooth"
            });

        }

      }
    );

  </script>

</body>
</html>
