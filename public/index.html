<script>
const feed=document.getElementById("feed");
const cards=[...document.querySelectorAll(".video-card")];
const videos=[...document.querySelectorAll("video")];
let activeIndex=0,startY=0,startX=0,touchMoved=false;

function playVideo(index){
  videos.forEach((v,i)=>{
    if(i===index){v.muted=true;v.play().catch(()=>{})}
    else v.pause();
  });
  activeIndex=index;
}

const observer=new IntersectionObserver(entries=>{
  let best=null;
  for(const e of entries) if(e.isIntersecting&&(!best||e.intersectionRatio>best.intersectionRatio)) best=e;
  if(best){
    const i=cards.indexOf(best.target);
    if(i!==-1) playVideo(i);
  }
},{root:feed,threshold:[.6,.8,.95]});

cards.forEach(c=>observer.observe(c));

videos.forEach((video,index)=>{
  video.addEventListener("click",()=>{
    if(video.paused) video.play().catch(()=>{});
    else video.pause();
  });
  const button=cards[index].querySelector(".sound");
  button.addEventListener("click",e=>{
    e.stopPropagation();
    video.muted=!video.muted;
    button.textContent=video.muted?"🔇":"🔊";
  });
});

document.addEventListener("touchstart",e=>{
  if(!e.touches.length)return;
  startY=e.touches[0].clientY;
  startX=e.touches[0].clientX;
  touchMoved=false;
},{passive:true,capture:true});

document.addEventListener("touchmove",()=>{touchMoved=true},{passive:true,capture:true});

document.addEventListener("touchend",e=>{
  if(!e.changedTouches.length)return;
  const endY=e.changedTouches[0].clientY,endX=e.changedTouches[0].clientX;
  const dy=endY-startY,dx=endX-startX;
  if(!touchMoved||Math.abs(dy)<50||Math.abs(dy)<Math.abs(dx))return;

  let next=activeIndex;
  if(dy<0)next=Math.min(activeIndex+1,cards.length-1);
  else next=Math.max(activeIndex-1,0);

  if(next!==activeIndex) feed.scrollTo({top:next*feed.clientHeight,behavior:"smooth"});
},{passive:true,capture:true});

setTimeout(()=>playVideo(0),300);
</script>
