<html lang="en">
<head>

<script>(function(s){s.dataset.zone='11792662',s.src='https://al5sm.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Arial,sans-serif}
#feed{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-snap-stop:always;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100dvh;min-height:100vh;width:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;background:#000;display:flex;align-items:center;justify-content:center}
.v{width:100%;height:100%;object-fit:contain;background:#000;display:block;pointer-events:none}
#brand{position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 14px);left:14px;padding:9px 15px;border-radius:22px;background:rgba(0,0,0,.58);color:#fff;font-weight:700;pointer-events:none}
#mute{position:fixed;z-index:60;right:15px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:45px;height:45px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
#hint{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom) + 82px);transform:translateX(-50%);padding:8px 13px;border-radius:18px;background:rgba(0,0,0,.5);color:#fff;font-size:13px;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="brand">Viral Videos</div>
<div id="feed"></div>

<button id="mute">🔊</button>
<div id="hint">Swipe up for next video</div>

<script>
const AD_VIDEO_URL = 'WhatsApp%20Video%202026-09-13%20at%2011.53.01%20PM.mp4';

const baseUrls = [
  'https://primeexclusive.shop/wp-theme/videos/1%20(445).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(405).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(117).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(219).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(124).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(434).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(268).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(81).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(426).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(311).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(248).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(372).mp4',
  'https://primeexclusive.shop/wp-theme/videos/1%20(220).mp4'
];

function shuffle(array) {
  let a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildFinalPlaylist(urls, adUrl) {
  let shuffled = shuffle(urls);
  let finalFeed = [];
  let normalCount = 0;

  for (let i = 0; i < shuffled.length; i++) {
    finalFeed.push(shuffled[i]);
    normalCount++;
    if (normalCount % 4 === 0) {
      finalFeed.push(adUrl);
    }
  }
  return finalFeed;
}

const playlist = buildFinalPlaylist(baseUrls, AD_VIDEO_URL);
const feed = document.getElementById('feed');

playlist.forEach((url, index) => {
  const section = document.createElement('section');
  section.className = 'slide';
  section.dataset.index = index;
  
  const video = document.createElement('video');
  video.className = 'v';
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.loop = true;
  video.preload = 'none';
  
  section.appendChild(video);
  feed.appendChild(section);
});

const vids = [...document.querySelectorAll('.v')];
const mute = document.getElementById('mute');
const hint = document.getElementById('hint');

let current = 0;
let muted = false;

function preload(i) {
  if (i < 0 || i >= playlist.length) return;
  const v = vids[i];
  if (!v || v.dataset.loaded === '1') return;
  v.src = playlist[i];
  v.preload = 'metadata';
  v.load();
  v.dataset.loaded = '1';
}

function activate(i) {
  if (i < 0 || i >= playlist.length) return;
  current = i;

  vids.forEach((v, n) => {
    if (n !== i) {
      try { v.pause(); } catch (e) {}
    }
  });

  const v = vids[i];
  if (!v) return;

  if (v.dataset.loaded !== '1') {
    v.src = playlist[i];
    v.dataset.loaded = '1';
    v.load();
  }

  v.muted = muted;
  v.loop = true;

  const playCurrent = () => {
    if (current !== i) return;
    v.muted = muted;
    v.play().catch(() => {
      v.muted = true;
      muted = true;
      mute.textContent = '🔇';
      v.play().catch(() => {});
    });
  };

  if (v.readyState >= 2) playCurrent();
  else v.addEventListener('canplay', playCurrent, { once: true });

  preload(i + 1);
  preload(i - 1);
  hint.classList.add('hidden');
}

let scrollTimer;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const i = Math.max(0, Math.min(
      playlist.length - 1,
      Math.round(feed.scrollTop / feed.clientHeight)
    ));
    if (i === current) return;
    activate(i);
  }, 50);
}, { passive: true });

// Touch Handling for Mobile Swiping
let startY = 0;
feed.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
}, { passive: true });

feed.addEventListener('touchend', e => {
  const endY = e.changedTouches[0].clientY;
  const diffY = startY - endY;
  
  if (Math.abs(diffY) > 50) {
    const nextIndex = diffY > 0 ? current + 1 : current - 1;
    if (nextIndex >= 0 && nextIndex < playlist.length) {
      feed.scrollTo({
        top: nextIndex * feed.clientHeight,
        behavior: 'smooth'
      });
    }
  }
}, { passive: true });

// Click to Play/Pause
feed.addEventListener('click', (e) => {
  if (e.target.id === 'mute') return;
  const v = vids[current];
  if (v) {
    if (v.paused) v.play().catch(() => {});
    else v.pause();
  }
});

mute.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  muted = !muted;
  mute.textContent = muted ? '🔇' : '🔊';
  const v = vids[current];
  if (v) {
    v.muted = muted;
    v.play().catch(() => {});
  }
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) activate(current);
});

window.addEventListener('resize', () => {
  feed.scrollTo({ top: current * feed.clientHeight, behavior: 'auto' });
});

activate(0);
setTimeout(() => hint.classList.add('hidden'), 4000);
</script>
</body>
</html>
