function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const urls=shuffle([...baseUrls]);

const feed=document.getElementById('feed');
const slides=[...document.querySelectorAll('.slide')];
const vids=[...document.querySelectorAll('.v')];
const status=document.getElementById('status');
const gate=document.getElementById('gate');
const watch=document.getElementById('watch');
const mute=document.getElementById('mute');
const hint=document.getElementById('hint');

let current=0;
let muted=false;
let locked=false;
let pauseTimer=null;
let lastTimedPause=-1;

function isFifthVideo(i){
  return i>=4 && ((i+1)%5===0);
}

function gateOn(){
  locked=true;
  gate.classList.add('show');
}

function gateOff(){
  locked=false;
  gate.classList.remove('show');
}

function stop(v){
  try{v.pause()}catch(e){}
}

function loadVideo(i, autoplay=true){
  const v=vids[i];
  if(!v) return;

  status.classList.remove('hidden');

  if(v.dataset.loaded !== '1'){
    v.src=urls[i];
    v.load();
    v.dataset.loaded='1';
  }

  v.muted=muted;
  v.loop=true;
  v.playsInline=true;

  const play=()=>{
    if(!autoplay || locked){
      status.classList.add('hidden');
      return;
    }

    const promise=v.play();
    if(promise){
      promise.then(()=>status.classList.add('hidden')).catch(()=>{
        v.muted=true;
        muted=true;
        mute.textContent='🔇';
        if(!locked){
          v.play().then(()=>status.classList.add('hidden'))
                 .catch(()=>status.classList.add('hidden'));
        }else{
          status.classList.add('hidden');
        }
      });
    }else{
      status.classList.add('hidden');
    }
  };

  if(v.readyState>=2) play();
  else {
    const ready=()=>{
      v.removeEventListener('canplay',ready);
      play();
    };
    v.addEventListener('canplay',ready);
    setTimeout(()=>{
      if(v.readyState<2) status.classList.add('hidden');
    },5000);
  }
}

function preload(i){
  if(i<0||i>=urls.length) return;
  const v=vids[i];
  if(v.dataset.loaded==='1') return;
  v.src=urls[i];
  v.preload='metadata';
  v.load();
  v.dataset.loaded='1';
}

function startThreeSecondPause(i){
  if(!isFifthVideo(i) || lastTimedPause===i) return;

  lastTimedPause=i;
  if(pauseTimer) clearTimeout(pauseTimer);

  const v=vids[i];
  stop(v);

  // Pause the screen and show Watch More for exactly 3 seconds.
  gateOn();

  pauseTimer=setTimeout(()=>{
    pauseTimer=null;
    gateOff();

    // Resume the same video normally.
    if(current===i){
      loadVideo(i,true);
    }
  },3000);
}

function activate(i){
  if(i<0||i>=urls.length) return;

  current=i;
  vids.forEach((v,n)=>{if(n!==i) stop(v)});

  if(isFifthVideo(i)){
    startThreeSecondPause(i);
  }

  loadVideo(i,!locked);
  preload(i+1);
  preload(i-1);

  hint.classList.add('hidden');
}

function go(i){
  if(i<0||i>=urls.length||locked) return;

  current=i;
  feed.scrollTo({
    top:i*feed.clientHeight,
    behavior:'smooth'
  });

  setTimeout(()=>{
    if(!locked && current===i) activate(i);
  },450);
}

let scrollTimer;
feed.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const i=Math.max(0,Math.min(
      urls.length-1,
      Math.round(feed.scrollTop/feed.clientHeight)
    ));

    if(locked){
      feed.scrollTo({
        top:current*feed.clientHeight,
        behavior:'auto'
      });
      return;
    }

    if(i===current) return;
    activate(i);
  },80);
},{passive:true});

// Reliable vertical swipe navigation for mobile/Telegram WebView.
let swipeStartY=0;
let swipeStartX=0;
let swipeActive=false;

document.addEventListener('touchstart',e=>{
  if(!e.touches[0]) return;
  swipeStartY=e.touches[0].clientY;
  swipeStartX=e.touches[0].clientX;
  swipeActive=false;
},{passive:true,capture:true});

document.addEventListener('touchmove',e=>{
  if(!e.touches[0]) return;
  const dy=e.touches[0].clientY-swipeStartY;
  const dx=e.touches[0].clientX-swipeStartX;

  if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){
    swipeActive=true;
  }
},{passive:true,capture:true});

document.addEventListener('touchend',e=>{
  if(!e.changedTouches[0] || !swipeActive || locked) return;

  const dy=e.changedTouches[0].clientY-swipeStartY;
  const dx=e.changedTouches[0].clientX-swipeStartX;

  if(Math.abs(dy)<35 || Math.abs(dy)<=Math.abs(dx)) return;

  const target=current+(dy<0 ? 1 : -1);
  if(target<0 || target>=urls.length) return;

  current=target;
  feed.scrollTo({
    top:target*feed.clientHeight,
    behavior:'smooth'
  });
  activate(target);
},{passive:true,capture:true});

// Watch More is only displayed during the 3-second pause.
// No unlock logic is attached to it. The feed automatically resumes.
watch.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
});

mute.addEventListener('click',e=>{
 e.preventDefault();
 e.stopPropagation();
 muted=!muted;
 mute.textContent=muted?'🔇':'🔊';
 const v=vids[current];
 v.muted=muted;
 v.play().catch(()=>{});
});

vids.forEach((v,i)=>{
 v.addEventListener('click',()=>{
   if(i!==current)return;
   if(v.paused)v.play().catch(()=>{});
   else v.pause();
 });
 v.addEventListener('error',()=>{
   if(i===current){
     status.textContent='Video could not be loaded';
     status.classList.remove('hidden');
   }
 });
});

document.addEventListener('visibilitychange',()=>{
 if(!document.hidden) setTimeout(()=>loadVideo(current,true),150);
});

window.addEventListener('resize',()=>{
 feed.scrollTo({top:current*feed.clientHeight,behavior:'auto'});
});

activate(0);
setTimeout(()=>hint.classList.add('hidden'),4000);
</script>
