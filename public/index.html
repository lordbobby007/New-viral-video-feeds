  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: Arial, sans-serif;
    }
    #feed {
      position: fixed; inset: 0; width: 100%; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none;
    }
    #video {
      display: block; position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; background: #000;
    }

    /* Instagram-Reels-style branding button */
    #brand {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 14px);
      left: 16px;
      z-index: 20;
      border: 0;
      border-radius: 22px;
      padding: 10px 16px;
      color: #fff;
      background: rgba(0,0,0,.55);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .1px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #loading {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #fff; font-size: 15px; background: #000; z-index: 5;
    }
    #loading.hidden { display: none; }

    #sound {
      position: absolute; right: 18px;
      bottom: calc(env(safe-area-inset-bottom) + 28px);
      z-index: 20; width: 48px; height: 48px;
      border: 0; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #fff;
      font-size: 22px;
    }

    /* Gate shown after every 5th video */
    #gate {
      position: absolute; inset: 0; z-index: 30;
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
      background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.12) 55%, rgba(0,0,0,.25));
      text-align: center;
      color: #fff;
      padding: 24px;
    }
    #gate.show { display: flex; }

    #gate-title {
      font-size: 22px; font-weight: 800;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    #gate-text {
      font-size: 14px; opacity: .9;
      margin-bottom: 16px;
    }
    #watchMore {
      border: 0;
      border-radius: 28px;
      padding: 14px 26px;
      min-width: 180px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 22px rgba(0,0,0,.35);
    }
    #watchMore:active { transform: scale(.97); }

    #error {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      color: #fff; text-align: center; z-index: 40;
      display: none; width: 90%;
    }
    #error button {
      margin-top: 12px; padding: 10px 18px;
      border: 0; border-radius: 20px; font-size: 15px;
    }

    #swipe {
      position: absolute;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 34px);
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255,255,255,.9);
      background: rgba(0,0,0,.45);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      transition: opacity .5s;
      pointer-events: none;
    }
    #swipe.hidden { opacity: 0; }
  </style>

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const sound = document.getElementById("sound");
    const gate = document.getElementById("gate");
    const watchMore = document.getElementById("watchMore");
    const retry = document.getElementById("retry");
    const swipe = document.getElementById("swipe");

    let currentIndex = 0;
    let startY = 0;
    let startX = 0;
    let moving = false;
    let changing = false;
    let unlocked = true;

    // Lock immediately after videos 5, 10, 15, ...
    function isGateVideo(index) {
      return (index + 1) % 5 === 0;
    }

    function showGate() {
      unlocked = false;
      gate.classList.add("show");
    }

    function hideGate() {
      unlocked = true;
      gate.classList.remove("show");
    }

    function loadVideo(index, autoplay = true) {
      if (index < 0 || index >= videoUrls.length || changing) return;

      changing = true;
      currentIndex = index;
      loading.classList.remove("hidden");
      document.getElementById("error").style.display = "none";

      video.pause();
      video.removeAttribute("src");
      video.load();

      video.muted = true;
      video.src = videoUrls[index];
      video.load();

      if (autoplay) video.play().catch(() => {});

      // The gate appears only after the 5th video has loaded.
      if (isGateVideo(index)) showGate();
      else hideGate();

      setTimeout(() => { changing = false; }, 120);
    }

    video.addEventListener("loadeddata", () => {
      loading.classList.add("hidden");
      video.play().catch(() => {});
    });

    video.addEventListener("canplay", () => {
      loading.classList.add("hidden");
      video.play().catch(() => {});
    });

    video.addEventListener("playing", () => {
      loading.classList.add("hidden");
      document.getElementById("error").style.display = "none";
    });

    video.addEventListener("error", () => {
      loading.classList.add("hidden");
      document.getElementById("error").style.display = "block";
    });

    sound.addEventListener("click", (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      sound.textContent = video.muted ? "🔇" : "🔊";
    });

    video.addEventListener("click", () => {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    });

    retry.addEventListener("click", (e) => {
      e.stopPropagation();
      loadVideo(currentIndex);
    });

    // IMPORTANT: this button is the user click that Monetag Onclick can use.
    // It unlocks the next videos only after the click.
    watchMore.addEventListener("click", (e) => {
      e.stopPropagation();
      hideGate();

      const next = currentIndex + 1;
      if (next < videoUrls.length) loadVideo(next);
    });

    // Phone swipe.
    document.addEventListener("touchstart", (e) => {
      if (!e.touches.length) return;
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
      moving = false;
    }, { passive: true });

    document.addEventListener("touchmove", () => {
      moving = true;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (!e.changedTouches.length) return;

      const endY = e.changedTouches[0].clientY;
      const endX = e.changedTouches[0].clientX;
      const dy = endY - startY;
      const dx = endX - startX;

      if (!moving || Math.abs(dy) < 60 || Math.abs(dy) <= Math.abs(dx)) return;

      // At the 5th video, scrolling is completely blocked until Watch more.
      if (!unlocked) return;

      if (dy < 0 && currentIndex < videoUrls.length - 1) {
        loadVideo(currentIndex + 1);
      } else if (dy > 0 && currentIndex > 0) {
        // Allow going back without opening another gate.
        loadVideo(currentIndex - 1);
      }

      swipe.classList.add("hidden");
    }, { passive: true });

    // Laptop mouse wheel.
    let wheelLock = false;
    document.addEventListener("wheel", (e) => {
      if (wheelLock || Math.abs(e.deltaY) < 30 || !unlocked) return;
      wheelLock = true;

      if (e.deltaY > 0 && currentIndex < videoUrls.length - 1) {
        loadVideo(currentIndex + 1);
      } else if (e.deltaY < 0 && currentIndex > 0) {
        loadVideo(currentIndex - 1);
      }

      setTimeout(() => wheelLock = false, 500);
    }, { passive: true });

    setTimeout(() => loadVideo(0), 50);
    setTimeout(() => swipe.classList.add("hidden"), 4000);
  </script>
